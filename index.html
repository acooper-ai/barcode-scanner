<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .page {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2.4rem;
    }

    .subtitle {
      margin: 0 0 35px;
      color: #667085;
      font-size: 1rem;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .choice {
      text-decoration: none;
      color: inherit;
      background: white;
      border-radius: 18px;
      padding: 45px 25px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      border: 3px solid transparent;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .choice:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    .assembly:hover {
      border-color: #0056b3;
    }

    .enrichments:hover {
      border-color: #198754;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 18px;
    }

    .choice-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .choice-description {
      color: #667085;
      font-size: 1rem;
      line-height: 1.5;
      max-width: 300px;
    }

    .assembly .choice-title {
      color: #0056b3;
    }

    .enrichments .choice-title {
      color: #198754;
    }

    @media (max-width: 650px) {
      .choices {
        grid-template-columns: 1fr;
      }

      .choice {
        min-height: 210px;
        padding: 35px 20px;
      }

      h1 {
        font-size: 2rem;
      }

      .choice-title {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1>QR Scanner</h1>
    <p class="subtitle">Choose what you are scanning for.</p>

    <div class="choices">

      <a class="choice assembly" href="assembly.html">
        <div class="icon">▦</div>

        <div class="choice-title">
          ASSEMBLY
        </div>

        <div class="choice-description">
          Use the handheld QR scanner to record assembly attendance.
        </div>
      </a>

      <a class="choice enrichments" href="enrichments.html">
        <div class="icon">▣</div>

        <div class="choice-title">
          ENRICHMENTS
        </div>

        <div class="choice-description">
          Use the device camera to scan students into enrichment activities.
        </div>
      </a>

    </div>

  </main>

</body>
</html>
